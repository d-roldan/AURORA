name: aegis
x-core-env: &core-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aegis-postgres:5432/${POSTGRES_DB}?schema=public
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_API_KEY: ${SERVICE_API_KEY}
  INFLUX_URL: http://aegis-influxdb:8086
  INFLUX_ORG: aegis
  INFLUX_TOKEN: ${INFLUX_APP_TOKEN:-${INFLUX_TOKEN}}
  ANALYTICS_URL: http://aegis-analytics:8000
  SIMULATOR_URL: http://aegis-simulator:8001
  DEMO_MODE: 'true'
  TZ: UTC
services:
  aegis-postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  aegis-influxdb:
    image: influxdb:2.7.12
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: aegis-admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: aegis
      DOCKER_INFLUXDB_INIT_BUCKET: aegis_vitals
      DOCKER_INFLUXDB_INIT_RETENTION: 2160h
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
      - ./infra/influxdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: [CMD, influx, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  aegis-migrate:
    build: ./apps/backend
    image: aegis-backend:0.1.1
    environment: *core-env
    command: [sh, -c, 'npx prisma migrate deploy && node prisma/seed.cjs']
    depends_on:
      aegis-postgres: {condition: service_healthy}
  aegis-backend:
    image: aegis-backend:0.1.1
    build: ./apps/backend
    environment:
      <<: *core-env
      SIMULATOR_AUTOSTART: 'true'
    depends_on:
      aegis-migrate: {condition: service_completed_successfully}
      aegis-influxdb: {condition: service_healthy}
      aegis-analytics: {condition: service_healthy}
      aegis-simulator: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/api/v1/system/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  aegis-analytics:
    image: aegis-analytics:0.1.1
    build: ./services/analytics
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  aegis-simulator:
    image: aegis-simulator:0.1.1
    build:
      context: ./services/simulator
      additional_contexts:
        aegis-analytics: service:aegis-analytics
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      CORE_API_URL: http://aegis-backend:3000
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  aegis-frontend:
    image: aegis-frontend:0.1.1
    build: ./apps/frontend
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  aegis-nginx:
    image: nginx:1.28.0-alpine
    networks: [default, ingress]
    ports: ['0.0.0.0:${HTTP_PORT:-8085}:8080']
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      aegis-backend: {condition: service_healthy}
      aegis-frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/v1/system/live]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  influx_data:
  influx_config:
networks:
  default:
    internal: true
  ingress:
